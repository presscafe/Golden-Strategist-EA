name: MQL5 compile check

# Compiles the indicator and both Expert Advisors with MetaEditor on a
# Windows runner. Fails if MetaEditor reports any error or if an .ex5 is
# not produced. Compile logs and binaries are uploaded as artifacts.
# On failure, the key diagnostics are also written as annotations so they
# can be read without downloading the logs.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "**.mq5"
      - "**.mqh"
      - ".github/workflows/mql5-compile.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MetaTrader 5 (silent)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList '/auto' -PassThru
          if (-not $proc.WaitForExit(900000)) { throw 'MT5 installer did not finish within 15 minutes' }
          Write-Host "Installer exit code: $($proc.ExitCode)"

          # The bootstrapper can return before the terminal is fully copied.
          # Wait until metaeditor64.exe and terminal64.exe sit in the same folder.
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, (Join-Path $env:LOCALAPPDATA 'Programs'), $env:LOCALAPPDATA) | Where-Object { $_ -and (Test-Path $_) }
          $editor = $null
          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline) {
            foreach ($r in $roots) {
              $hit = Get-ChildItem -Path $r -Filter 'metaeditor64.exe' -Recurse -ErrorAction SilentlyContinue -Depth 4 |
                Where-Object { Test-Path (Join-Path (Split-Path $_.FullName) 'terminal64.exe') } |
                Select-Object -First 1
              if ($hit) { $editor = $hit.FullName; break }
            }
            if ($editor) { break }
            Start-Sleep -Seconds 15
          }
          if (-not $editor) { throw 'metaeditor64.exe with terminal64.exe not found after installation' }
          Write-Host "MetaEditor: $editor"
          Start-Sleep -Seconds 30   # let remaining file copies settle
          "MT5_EDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile indicator, then EAs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logDir = Join-Path $env:RUNNER_TEMP 'mql5-logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $diag = Join-Path $logDir 'diag.txt'

          # Escape text for a GitHub workflow command and print it as an annotation.
          function Emit([string]$level, [string]$text) {
            $t = $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            for ($i = 0; $i -lt $t.Length; $i += 3000) {
              $len = [Math]::Min(3000, $t.Length - $i)
              Write-Output ("::{0} title=mql5::{1}" -f $level, $t.Substring($i, $len))
            }
          }
          function Note([string]$msg) { Add-Content -Path $diag -Value $msg; Write-Host $msg }

          try {
            $editor = $env:MT5_EDITOR
            $mt5Dir = Split-Path $editor
            $mql5   = Join-Path $mt5Dir 'MQL5'
            Note "editor=$editor"
            Note "mt5Dir exists=$(Test-Path $mt5Dir) mql5 exists=$(Test-Path $mql5)"
            Note "workspace=$(Get-Location)"
            Note ("workspace files: " + ((Get-ChildItem -Name -Filter '*.mq*') -join ', '))

            # Shared include used via <Datetime.mqh>
            $inc = Join-Path $mql5 'Include'
            New-Item -ItemType Directory -Force -Path $inc | Out-Null
            Copy-Item 'Datetime.mqh' $inc -Force
            Note "copied Datetime.mqh to $inc"

            function Invoke-Compile([string]$relSrc) {
              $src  = (Resolve-Path $relSrc).Path
              $name = [IO.Path]::GetFileNameWithoutExtension($src)
              $log  = Join-Path $logDir ($name + '.log')
              if (Test-Path $log) { Remove-Item $log -Force }
              Note "compiling $src"
              $p = Start-Process -FilePath $editor -ArgumentList @("/compile:`"$src`"", "/log:`"$log`"") -PassThru -WindowStyle Hidden
              if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "MetaEditor timed out compiling $src" }
              Note "metaeditor exit code for ${name}: $($p.ExitCode); log exists=$(Test-Path $log)"

              if (-not (Test-Path $log)) { throw "No compile log produced for $src" }
              $text = [IO.File]::ReadAllText($log, [Text.Encoding]::Unicode)
              Write-Host "----- $src -----"
              Write-Host $text
              $m = [regex]::Match($text, 'Result:\s*(\d+)\s+errors?,\s*(\d+)\s+warnings?')
              if (-not $m.Success) { throw "No 'Result:' line in compile log for $src" }
              $errors = [int]$m.Groups[1].Value
              Note "$name : errors=$errors warnings=$($m.Groups[2].Value)"
              if ($errors -gt 0) {
                $lines = ($text -split "`r?`n") | Where-Object { $_ -match 'error|Result' } | Select-Object -First 20
                Note ("log lines for ${name}: " + ($lines -join ' | '))
                throw "$src failed with $errors error(s)"
              }
              return [IO.Path]::ChangeExtension($src, '.ex5')
            }

            # 1) Indicator first: the EAs embed it with #resource "\\ATRStopLoss_Ind.ex5"
            $ind = Invoke-Compile 'ATRStopLoss_Ind.mq5'
            $indDir = Join-Path $mql5 'Indicators'
            New-Item -ItemType Directory -Force -Path $indDir | Out-Null
            Copy-Item $ind $indDir -Force
            Copy-Item $ind (Join-Path $mql5 'ATRStopLoss_Ind.ex5') -Force

            # 2) Expert Advisors
            $built = @()
            foreach ($ea in @('Golden Strategist EA_v1.mq5', 'Golden Strategist EA_v2.mq5')) {
              $built += (Invoke-Compile $ea)
            }
            foreach ($b in $built) { if (-not (Test-Path $b)) { throw "Expected binary missing: $b" } }
            Note "All compiled: $($built -join ', ')"
            Emit 'notice' ("All compiled: " + ($built -join ', '))
          }
          catch {
            Note ("FAILED: " + $_.Exception.Message)
            $all = if (Test-Path $diag) { Get-Content $diag -Raw } else { '' }
            Emit 'error' ("DIAG " + $all)
            throw
          }

      - name: Upload logs and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql5-compile-output
          path: |
            ${{ runner.temp }}/mql5-logs
            *.ex5
          if-no-files-found: warn
